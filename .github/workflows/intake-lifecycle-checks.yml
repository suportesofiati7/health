name: Intake lifecycle verification

on:
  pull_request:
    paths:
      - "management/supabase/functions/intake-notifications/**"
      - "management/tests/**"
      - "management/src/main.jsx"
      - "management/src/PatientPicker.jsx"
      - "management/supabase/migrations/**"
      - "management/package*.json"
      - ".github/workflows/intake-lifecycle-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: management/package-lock.json
      - run: npm ci
      - name: Full management unit and integration-style suite
        run: npm test
      - name: Compile management app
        run: npm run build

  postgres-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: management
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL tools for disposable local test cluster
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common postgresql-16 postgresql-client-16
      - name: Test all SQL migrations and rollback-only conversion/linking fixtures
        run: bash scripts/test-db.sh
