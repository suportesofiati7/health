name: One-time live intake test (synthetic records)

on:
  pull_request:
    paths:
      - "management/tests/live-intake-smoke-20261102.mjs"
      - ".github/workflows/live-intake-smoke-20261102.yml"

permissions:
  contents: read

jobs:
  submit-synthetic-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify corrected PNG is publicly served from the clinic website
        run: |
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 --max-time 180 -o /tmp/sofiati-email-logo.png \
            https://raw.githubusercontent.com/suportesofiati7/health/main/assets/brand/email/monograma-fs-dourado-transparente.png
          python - <<'PY'
          from pathlib import Path
          logo = Path('/tmp/sofiati-email-logo.png').read_bytes()
          assert logo[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]), 'unexpected image format'
          assert len(logo) > 10000, 'unexpectedly small image'
          print('PUBLIC CLEAN PNG OK', len(logo), 'bytes')
          PY
      - name: Submit labelled dummy form with PDF, PNG and JPEG
        run: node management/tests/live-intake-smoke-20261102.mjs
