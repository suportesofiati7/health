name: Performance safeguards

on:
  pull_request:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - uses: actions/cache@v4
        with:
          path: .cache/production-images
          key: ${{ runner.os }}-production-images-${{ hashFiles('package-lock.json', 'assets/**') }}
          restore-keys: ${{ runner.os }}-production-images-
      - name: Build the current Portuguese site
        run: npm run build
      - name: Mobile Lighthouse CI
        run: npm run perf:mobile
      - name: Desktop Lighthouse CI
        run: npm run perf:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: performance-reports/lighthouse
          retention-days: 14
