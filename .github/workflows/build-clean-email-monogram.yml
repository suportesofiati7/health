name: Create clean FS email logo asset
on:
  pull_request:
    paths:
      - "scripts/build-clean-email-monogram.py"
      - ".github/workflows/build-clean-email-monogram.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make-logo:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.3.4
      - run: python scripts/build-clean-email-monogram.py
      - name: Commit generated transparent PNG to the pull request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/email/monograma-fs-dourado-transparente.png
          if ! git diff --cached --quiet; then
            git commit -m "fix(branding): publish artifact-free gold email logo"
            git push origin HEAD:${{ github.head_ref }}
          fi
